<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether AI Services</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1a0b2e, #090a0f);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient background glows */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
    }
    body::before { background: #7928ca; top: 10%; left: 15%; }
    body::after { background: #00dfd8; bottom: 10%; right: 15%; }

    /* Glassmorphism Container */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.125);
      border-radius: 20px;
      width: 100%;
      max-width: 900px;
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2rem;
      background: linear-gradient(45deg, #00dfd8, #7928ca);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* API Key Field Header */
    .auth-container {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .auth-container label {
      font-size: 0.85rem;
      color: #00dfd8;
      font-weight: 600;
    }

    /* Service Navigation */
    .nav-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 25px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ccc;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .tab-btn:hover, .tab-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border-color: #00dfd8;
      box-shadow: 0 0 10px rgba(0, 223, 216, 0.3);
    }

    /* Form UI */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .lang-input {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .lang-input label {
      font-size: 0.85rem;
      color: #aaa;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 15px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #7928ca;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 15px;
      color: #fff;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #7928ca;
    }

    .submit-btn {
      background: linear-gradient(45deg, #7928ca, #00dfd8);
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.3s ease;
      align-self: flex-end;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    /* Output Section */
    .output-box {
      margin-top: 25px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 80px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <header>
      <h1>Aether AI Studio</h1>
      <p style="color: #aaa; font-size: 0.9rem; margin-top: 5px;">Select a service and run prompt queries against your FastAPI LLM server.</p>
    </header>

    <div class="auth-container">
      <label for="apiKeyInput">API Authentication Key (X-API-Key):</label>
      <input type="password" id="apiKeyInput" placeholder="Enter your API Key..." oninput="saveApiKey()">
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="selectService('chat', 'Ask me anything...', 'Send')">Chatbot</button>
      <button class="tab-btn" onclick="selectService('summarize', 'Paste long text here to summarize...', 'Summarize')">Summarizer</button>
      <button class="tab-btn" onclick="selectService('generate-story', 'Enter a prompt or genre for a story...', 'Generate Story')">Story Generator</button>
      <button class="tab-btn" onclick="selectService('code-explainer', 'Paste code snippet to explain...', 'Explain Code')">Code Explainer</button>
      <button class="tab-btn" onclick="selectService('polish-grammer', 'Paste draft text to polish grammar and style...', 'Polish Text')">Grammar Polisher</button>
      <button class="tab-btn" onclick="selectService('lang-translator', 'Paste text you want to translate...', 'Translate')">Language Translator</button>
    </div>

    <div class="input-group">
      <div id="targetLangContainer" class="lang-input" style="display: none;">
        <label for="targetLang">Target Language:</label>
        <input type="text" id="targetLang" placeholder="e.g., Spanish, French, German, Japanese" value="Spanish">
      </div>

      <textarea id="userInput" placeholder="Ask me anything..."></textarea>
      <button class="submit-btn" id="submitBtn" onclick="sendRequest()">Send</button>
    </div>

    <div class="output-box" id="output">
      <span style="color: #666;">Response will appear here...</span>
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://ai-webservices.vercel.app/api/v1";
    let activeEndpoint = "chat";

    // Auto-load stored API key from local storage on page load
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('x_api_key');
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
      }
    });

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('x_api_key', key);
    }

    function selectService(endpoint, placeholderText, buttonText) {
      activeEndpoint = endpoint;

      document.getElementById('userInput').placeholder = placeholderText;
      document.getElementById('submitBtn').innerText = buttonText;

      document.getElementById('userInput').value = '';
      document.getElementById('output').innerHTML = '<span style="color: #666;">Response will appear here...</span>';

      const targetLangContainer = document.getElementById('targetLangContainer');
      if (endpoint === 'lang-translator') {
        targetLangContainer.style.display = 'flex';
      } else {
        targetLangContainer.style.display = 'none';
      }

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    async function sendRequest() {
      const inputField = document.getElementById('userInput');
      const outputDiv = document.getElementById('output');
      const apiKeyInput = document.getElementById('apiKeyInput');

      const rawPromptText = inputField.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!apiKey) {
        outputDiv.innerHTML = '<span style="color: #ffaa00;">Error: Please enter an API Key in the field above.</span>';
        return;
      }

      if (!rawPromptText) return;

      let finalPrompt = rawPromptText;

      if (activeEndpoint === 'lang-translator') {
        const targetLang = document.getElementById('targetLang').value.trim() || 'English';
        finalPrompt = `Translate the following text into ${targetLang}:\n\n${rawPromptText}`;
      }

      outputDiv.innerHTML = '<span style="color: #aaa;">Generating response...</span>';

      try {
        const response = await fetch(`${API_BASE_URL}/${activeEndpoint}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': apiKey
          },
          body: JSON.stringify({ text: finalPrompt })
        });

        if (!response.ok) {
          if (response.status === 401 || response.status === 403) {
            throw new Error(`Unauthorized (Status ${response.status}): Invalid X-API-Key provided.`);
          }
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();
        outputDiv.innerText = data.output || data.result || data.response || JSON.stringify(data, null, 2);
      } catch (error) {
        outputDiv.innerHTML = `<span style="color: #ff5555;">Error: ${error.message}</span>`;
      }
    }
  </script>
</body>
</html>
